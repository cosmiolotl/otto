# Build the web client (engine → WebAssembly, then Vite) and publish it to GitHub Pages:
# https://cosmiolotl.github.io/otto/
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy web to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/sim/**"
      - "crates/bot/**"
      - "weights/mean-0511.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Must equal the wasm-bindgen version pinned in web/engine/Cargo.toml (build-wasm.mjs checks).
      - name: Read pinned wasm-bindgen version
        id: wb
        run: echo "version=$(grep -oP 'wasm-bindgen = "=\K[^"]+' engine/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # wasm + typecheck + vite build → web/dist
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
