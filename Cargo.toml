[workspace]
resolver = "3"
members = ["crates/*", "web/engine"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1.15", features = ["union", "const_generics"] }
rayon = "1.11"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

# The browser build (web/engine): small and fast, no debug info.
[profile.wasm]
inherits = "release"
debug = 0
lto = "fat"
panic = "abort"

[profile.bench]
debug = 1
